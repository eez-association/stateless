name: EEZ Reth compatibility

on:
  push:
    branches: [feat/reth-27429, feat/reth-v2.7-candidate-block-hashes]
  pull_request:
    branches: [feat/reth-27429, feat/reth-v2.7-candidate-block-hashes]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_MIN_STACK: 16777216

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.95.0 fmt --all --check
      - name: Clippy
        run: cargo +1.95.0 clippy --locked -p stateless -p tries -p zeth-mpt --all-targets -- -D warnings
      - name: Validator, checkpoint oracle and trie regressions
        run: cargo +1.95.0 test --locked -p stateless -p tries -p zeth-mpt
