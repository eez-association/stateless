[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/paradigmxyz/stateless"
repository = "https://github.com/paradigmxyz/stateless"
exclude = [".github/"]

[workspace]
members = [
    "crates/stateless",
    "crates/tries",
    "crates/zeth-mpt",
    "testing/ef-tests",
]
resolver = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.lints.rustdoc]
all = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"

[workspace.dependencies]
# internal
stateless = { path = "crates/stateless" }
tries = { path = "crates/tries" }

# reth
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-db = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-db-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-primitives-traits = { version = "0.8.2", default-features = false }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-trie = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }
reth-trie-db = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-trie-sparse = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0", default-features = false }

# alloy
alloy-consensus = { version = "=2.5.0", default-features = false }
alloy-eips = { version = "=2.5.0", default-features = false }
alloy-genesis = { version = "=2.5.0", default-features = false }
alloy-primitives = { version = "1.6.0", default-features = false, features = ["map-foldhash", "map-indexmap"] }
alloy-rlp = { version = "0.3.13", default-features = false }
alloy-rpc-types-debug = { version = "=2.5.0", default-features = false }
alloy-trie = { version = "0.9.4", default-features = false }

# evm2
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "66687c18b34d3bdbb899f5eb7605070615c03475", default-features = false, features = ["block"] }

# misc
arrayvec = { version = "0.7", default-features = false }
bincode = "1.3"
itertools = { version = "0.14", default-features = false, features = [
    "use_alloc",
] }
rayon = "1.8"
rkyv = "0.8"
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = "1.0"
serde_with = { version = "3.16", default-features = false, features = [
    "alloc",
] }
thiserror = { version = "2.0", default-features = false }
walkdir = "2.5"

# Use the same reviewed Clone/finalization/system-call hooks as the RollupX candidate.
# Task-local source; replace with an approved immutable Git ref before publication.
[patch."https://github.com/alloy-rs/evm2"]
evm2 = { git = "https://github.com/DaniPopes/evm2", rev = "e681662b6d9ec59edafd112f7c8d64f49f1e6dd1" }
evm2-inspectors = { git = "https://github.com/DaniPopes/evm2", rev = "e681662b6d9ec59edafd112f7c8d64f49f1e6dd1" }
evm2-jit = { git = "https://github.com/DaniPopes/evm2", rev = "e681662b6d9ec59edafd112f7c8d64f49f1e6dd1" }

# Match the core types used by the Reth v2.11.0 release.
[patch.crates-io]
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
